<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#060d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ayman IPTV">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Ayman Smart IPTV</title>
</head>
<body>
  <div id="app">
    <section id="loginView" class="view active">
      <div class="login-card glass">
        <div class="brand brand-large">
          <div class="brand-mark">A</div>
          <div class="brand-text"><b>AYMAN</b> <span>SMART IPTV</span></div>
        </div>
        <p class="muted">Live TV · Movies · Series</p>
        <form id="loginForm" autocomplete="off">
          <label>Server URL</label>
          <input id="serverInput" type="url" inputmode="url" placeholder="https://server.example:port" required>
          <label>Username</label>
          <input id="usernameInput" type="text" autocapitalize="none" autocomplete="username" required>
          <label>Password</label>
          <input id="passwordInput" type="password" autocomplete="current-password" required>
          <label class="remember-row"><input id="rememberInput" type="checkbox" checked> <span>Remember login on this iPhone</span></label>
          <button class="primary" type="submit">CONNECT</button>
        </form>
        <details class="advanced">
          <summary>Connection settings</summary>
          <label>Optional API proxy URL</label>
          <input id="proxyInput" type="url" inputmode="url" placeholder="https://your-worker.workers.dev">
          <small>Only needed if the IPTV server blocks browser API requests (CORS). Video streams are not proxied.</small>
        </details>
        <div id="loginError" class="error hidden"></div>
      </div>
    </section>

    <section id="mainView" class="view">
      <header class="topbar">
        <div class="brand brand-small"><div class="brand-mark">A</div><div class="brand-text"><b>AYMAN</b> <span>SMART IPTV</span></div></div>
        <div class="top-actions"><button id="refreshBtn" class="icon-btn" aria-label="Refresh">↻</button><button id="logoutBtn" class="icon-btn" aria-label="Logout">⏻</button></div>
      </header>
      <main id="mainContent"></main>
      <nav class="bottom-nav">
        <button data-tab="home" class="nav-item active">⌂<span>Home</span></button>
        <button data-tab="favorites" class="nav-item">♥<span>Favorites</span></button>
        <button data-tab="continue" class="nav-item">▶<span>Continue</span></button>
        <button data-tab="search" class="nav-item">⌕<span>Search</span></button>
      </nav>
    </section>

    <section id="playerView" class="view player-view">
      <div id="rotateHint" class="rotate-hint hidden">Rotate iPhone for landscape</div>
      <video id="video" playsinline webkit-playsinline preload="auto"></video>
      <div id="playerShade" class="player-shade"></div>
      <div id="playerControls" class="player-controls visible">
        <div class="player-top">
          <button id="playerBack" class="round-btn" aria-label="Back">‹</button>
          <div id="playerTitle" class="player-title"></div>
          <button id="pipBtn" class="round-btn" aria-label="Picture in Picture">▣</button>
        </div>
        <div class="center-controls">
          <button id="playPauseBtn" class="play-btn">❚❚</button>
        </div>
        <div class="player-bottom glass-dark">
          <div id="seekWrap" class="seek-wrap hidden">
            <span id="currentTime">0:00</span>
            <input id="seekBar" type="range" min="0" max="1000" value="0">
            <span id="durationTime">0:00</span>
          </div>
          <div class="player-buttons">
            <button id="scaleBtn" class="pill-btn">ZOOM</button>
            <button id="audioBtn" class="pill-btn">AUDIO</button>
            <button id="subBtn" class="pill-btn">SUBS</button>
            <button id="retryBtn" class="pill-btn hidden">RETRY</button>
          </div>
          <div id="playerStatus" class="player-status">Loading…</div>
        </div>
      </div>
    </section>

    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-card">
        <div class="sheet-handle"></div>
        <h3 id="sheetTitle"></h3>
        <div id="sheetBody"></div>
        <button id="sheetClose" class="secondary">Close</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
